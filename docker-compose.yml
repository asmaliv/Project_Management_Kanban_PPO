services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ppo_kanban_dev
      POSTGRES_USER: ppo_app
      POSTGRES_PASSWORD: ppo_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppo_app -d ppo_kanban_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
