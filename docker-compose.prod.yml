services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ppo_kanban_prod}
      POSTGRES_USER: ${POSTGRES_USER:-ppo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - ppo_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ppo_app} -d ${POSTGRES_DB:-ppo_kanban_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-ppo_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ppo_kanban_prod}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
    networks:
      - ppo_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-80}:8080"
    networks:
      - ppo_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/index.html || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pgdata_prod:

networks:
  ppo_net:
    driver: bridge
