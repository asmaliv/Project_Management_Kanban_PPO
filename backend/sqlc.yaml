version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: 
      - "migrations/000001_create_users_and_sessions.up.sql"
      - "migrations/000002_create_audit_logs.up.sql"
      - "migrations/000003_create_projects_members_columns.up.sql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
